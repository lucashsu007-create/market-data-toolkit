name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # index.html carries a JS port of the router so the demo can classify text
      # typed into the page. tests/test_js_parity.py runs that shipped block
      # under node and diffs it against the Python original.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - name: Tests
        # A parity suite that skips itself is indistinguishable from one that
        # passes. In CI a missing node is a failure, not a shrug.
        env:
          MDT_REQUIRE_NODE: "1"
        run: pytest --cov=mdt --cov-report=term-missing

      # data/estate.json + corpus/ are the source of truth; the demo payload
      # is generated from them. If this fails, someone edited one side without
      # regenerating the other.
      - name: Demo payload is up to date
        run: |
          python scripts/build_payload.py
          git diff --exit-code index.html \
            || { echo "::error::run scripts/build_payload.py and commit the result"; exit 1; }
