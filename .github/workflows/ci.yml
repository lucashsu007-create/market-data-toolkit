name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest --cov=mdt --cov-report=term-missing

      # data/estate.json is now authored (source of truth flipped when the
      # utp_sip feed was added for the real notice corpus): the demo payload
      # will be *generated from it* by scripts/build_payload.py, not the other
      # way round. extract_estate.py remains as the historical bootstrap.
      # A payload-drift check returns here once build_payload.py exists.
