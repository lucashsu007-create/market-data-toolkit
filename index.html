<style>/* ============================================================
   Market-data impact graph — cluster styles (dark, TradingView-ish)
   Scoped under .mdig so it can live as a section of a personal site.
   ============================================================ */
.mdig {
  --bg: #0c0e15; --panel: #131722; --panel-2: #161b27; --line: #2a2e39;
  --ink: #d1d4dc; --muted: #868a96; --flow: #5b6472; --gov: #444b59;
  --up: #26a69a; --down: #ef5350; --blue: #2962ff;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Trebuchet MS", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  height: 100vh; display: flex; flex-direction: column;
  padding: 16px 18px 12px; max-width: 1320px; margin: 0 auto;
}
.mdig *, .mdig *::before, .mdig *::after { box-sizing: border-box; }

/* ---- header ---- */
.mdig-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; flex: none; }
.mdig-head h1 { margin: 0 0 2px; font-size: 21px; letter-spacing: -0.01em; color: #f0f3fa; }
.mdig-head p { margin: 0; color: var(--muted); max-width: 700px; font-size: 13px; }
.mdig-byline { font-size: 13px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.mdig-byline strong { color: var(--ink); font-weight: 600; }
.mdig-syn { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }

/* ---- nav tabs ---- */
.mdig-nav { display: flex; gap: 4px; flex: none; margin: 14px 0 12px; flex-wrap: wrap; }
.mdig-nav button { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .12s ease; }
.mdig-nav button:hover { border-color: #3d434f; background: #1b2130; }
.mdig-nav button.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.mdig-nav button:disabled { opacity: .45; cursor: default; }
.mdig-nav button .soon { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-left: 5px; }

/* ---- view container ---- */
.mdig-view { flex: 1 1 auto; min-height: 0; }
.mdig-foot { margin-top: 8px; flex: none; color: var(--muted); font-size: 11px; }

/* ---- shared components ---- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
.badge { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; font-family: var(--mono); display: inline-block; }
.badge.review { background: rgba(239,83,80,.16); color: #ff6b66; border: 1px solid rgba(239,83,80,.35); }
.badge.clear { background: rgba(38,166,154,.16); color: #4cd2c4; border: 1px solid rgba(38,166,154,.35); }
.badge.prio-high { background: rgba(239,83,80,.16); color: #ff6b66; }
.badge.prio-medium { background: rgba(255,159,10,.16); color: #ffb84d; }
.badge.prio-low { background: rgba(38,166,154,.16); color: #4cd2c4; }
.badge.conf { background: rgba(41,98,255,.18); color: #6f93ff; }
.badge.nomatch { background: rgba(120,123,134,.18); color: #aab0bb; }
.counts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.count { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 12px; color: var(--muted); }
.count b { font-size: 17px; display: block; color: var(--ink); font-family: var(--mono); }
.risk { font-size: 12.5px; padding: 6px 9px; border-radius: 7px; background: rgba(255,159,10,.08); border: 1px solid rgba(255,159,10,.25); color: #ffc06b; margin-bottom: 5px; }
.risk.none { background: rgba(38,166,154,.08); border-color: rgba(38,166,154,.25); color: #6fdccf; }
.btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .12s ease; }
.btn:hover { border-color: #3d434f; background: #1b2130; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: #1e54e6; }

/* ---- overview ---- */
.ov-grid { display: grid; gap: 14px; height: 100%; grid-template-rows: auto auto 1fr; min-height: 0; overflow-y: auto; }
.ov-hero h2 { margin: 2px 0 6px; font-size: 22px; color: #f0f3fa; }
.ov-hero p { margin: 0; color: #aab0bb; font-size: 14px; max-width: 760px; }
.ov-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.ov-stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.ov-stat b { display: block; font-size: 22px; font-family: var(--mono); color: #f0f3fa; }
.ov-stat span { font-size: 12px; color: var(--muted); }
.ov-stat.good b { color: #4cd2c4; }
.layers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.layer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; }
.layer .lnum { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.layer h3 { margin: 4px 0 2px; font-size: 15px; color: #f0f3fa; }
.layer .q { color: var(--muted); font-size: 12.5px; font-style: italic; margin-bottom: 8px; }
.layer p { margin: 0 0 10px; font-size: 12.5px; color: #aab0bb; }
.layer .metric { margin-top: auto; font-size: 12px; font-family: var(--mono); color: #4cd2c4; background: rgba(38,166,154,.1); border: 1px solid rgba(38,166,154,.25); border-radius: 7px; padding: 6px 8px; }
.layer.l2 { border-color: rgba(41,98,255,.4); }
.ov-cta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---- placeholder (stub views) ---- */
.stub { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; color: var(--muted); }
.stub h2 { color: var(--ink); margin: 0 0 6px; }
.stub p { max-width: 420px; }

/* ============================================================
   Graph module (mounted by graph.js); classes prefixed g-
   ============================================================ */
.g-wrap { display: grid; grid-template-columns: 250px 1fr; gap: 14px; height: 100%; min-height: 0; }
.g-wrap.focused { grid-template-columns: 1fr; }
.g-side { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding-right: 3px; }
.g-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.g-scnlist { display: flex; flex-direction: column; gap: 4px; }
.g-scn { text-align: left; border: 1px solid transparent; background: var(--panel-2); color: var(--ink); padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; transition: background .12s ease; }
.g-scn:hover { background: #1b2130; }
.g-scn.active { background: var(--blue); color: #fff; }
.g-scn .m { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.g-scn.active .m { color: rgba(255,255,255,.75); }
.g-views { display: flex; gap: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.g-views button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.g-views button.active { background: #2a3040; color: #fff; }
.g-quick { display: flex; gap: 5px; margin-bottom: 9px; }
.g-quick button { flex: 1; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 11.5px; }
.g-quick button:hover { color: var(--ink); border-color: #3d434f; }
.g-types { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; }
.g-type { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); cursor: pointer; user-select: none; }
.g-type input { accent-color: var(--blue); width: 13px; height: 13px; margin: 0; cursor: pointer; }
.g-type .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.g-type.off { color: var(--muted); }
.g-type.off .dot { opacity: .3; }
.g-elegend { margin-top: 10px; font-size: 11px; color: var(--muted); display: flex; gap: 14px; }
.g-elegend .e { display: inline-flex; align-items: center; gap: 5px; }
.g-elegend .ln { width: 18px; border-top: 2px solid var(--flow); }
.g-elegend .ln.g { border-top: 2px dashed var(--gov); }

.g-main { display: flex; flex-direction: column; min-height: 0; }
.g-note { color: var(--muted); font-size: 12px; margin: 0 0 8px; min-height: 18px; }
.g-note b { color: #aab0bb; font-weight: 600; }
.g-canvas {
  position: relative; flex: 1 1 auto; min-height: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background:
    repeating-linear-gradient(0deg, transparent 0, transparent 39px, rgba(255,255,255,.020) 39px, rgba(255,255,255,.020) 40px),
    repeating-linear-gradient(90deg, transparent 0, transparent 39px, rgba(255,255,255,.020) 39px, rgba(255,255,255,.020) 40px),
    var(--panel);
}
.g-canvas svg { display: block; width: 100%; height: 100%; cursor: grab; }
.g-canvas svg:active { cursor: grabbing; }
.g-canvas .node circle { transition: opacity .25s ease, stroke .2s ease; }
.g-canvas .node text { font-size: 10px; fill: #c7ccd6; paint-order: stroke; stroke: #0c0e15; stroke-width: 3px; pointer-events: none; }
.g-canvas .links path { fill: none; transition: opacity .25s ease; }
.g-canvas .node.dim circle, .g-canvas .node.dim text { opacity: .07; }
.g-canvas .links path.dim { opacity: .04; }
.g-canvas .col-head { fill: #8b919c; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.g-canvas .col-rule { stroke: var(--line); stroke-dasharray: 2 4; }
.g-canvas .mx-grid line { stroke: rgba(255,255,255,.04); }
.g-canvas .mx-sep { stroke: #353b48; stroke-width: 1; }
.g-canvas .mx-grp { fill: #8b919c; font-size: 10px; font-weight: 600; }
.g-canvas .cell { transition: opacity .2s ease; }
.g-canvas .cell.dim { opacity: .05; }
.g-zoombar { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.g-zoombar button { width: 28px; height: 28px; border: 1px solid var(--line); background: rgba(22,27,39,.85); color: var(--ink); border-radius: 6px; cursor: pointer; font-size: 15px; line-height: 1; }
.g-zoombar button:hover { background: #1b2130; }
.g-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; pointer-events: none; text-align: center; padding: 20px; }
.g-overlay .t { color: #ff6b66; font-weight: 700; font-size: 15px; }
.g-overlay .s { color: var(--muted); font-size: 12.5px; margin-top: 4px; max-width: 340px; }
.g-panel h4 { margin: 0 0 2px; font-size: 15px; color: #f0f3fa; }
.g-panel .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
.g-panel .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.g-panel .meta { font-size: 12.5px; color: #9aa0aa; }
.g-panel .action { margin-top: 12px; font-size: 12.5px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.g-panel .counts { margin-bottom: 14px; }

.g-tooltip { position: fixed; pointer-events: none; background: #1c2230; color: var(--ink); border: 1px solid var(--line); padding: 7px 10px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .1s; max-width: 250px; z-index: 50; box-shadow: 0 8px 26px rgba(0,0,0,.45); }
.g-tooltip strong { color: #f0f3fa; }
.g-tooltip .tt { color: var(--muted); font-size: 11px; }

/* ---- pipeline (walkthrough) ---- */
.pipe { display: flex; flex-direction: column; height: 100%; min-height: 0; gap: 12px; }
.pipe-top { flex: none; }
.pipe-scn { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.pipe-scn button { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 12.5px; }
.pipe-scn button:hover { background: #1b2130; }
.pipe-scn button.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.pipe-steps { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.pipe-step button { border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; display: inline-flex; gap: 7px; align-items: center; }
.pipe-step button .n { width: 18px; height: 18px; border-radius: 50%; background: var(--line); color: var(--ink); font-size: 11px; font-family: var(--mono); display: inline-flex; align-items: center; justify-content: center; }
.pipe-step button.active { border-color: var(--blue); color: #fff; background: rgba(41,98,255,.15); }
.pipe-step button.active .n { background: var(--blue); color: #fff; }
.pipe-step button.done { color: var(--ink); }
.pipe-arrow { color: var(--muted); margin: 0 7px; }
.pipe-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.pipe-raw { background: #0e1118; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 12px; color: #aab0bb; white-space: pre-wrap; margin: 0; }
.pipe-hint { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 13px; align-items: baseline; }
.kv .k { color: var(--muted); }
.kv .v { color: var(--ink); font-family: var(--mono); word-break: break-word; }
.pipe-impact { display: grid; grid-template-columns: 1fr 300px; gap: 14px; }
.pipe-graph { height: 380px; }
.pipe-side h5 { margin: 0 0 6px; font-size: 12.5px; color: #f0f3fa; }
.pipe-side .grp { margin-bottom: 12px; }
.pipe-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11.5px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--ink); }
.tag.feed { border-color: rgba(41,98,255,.5); }
.pipe-ticket { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; }
.pipe-ticket h5 { margin: 0 0 8px; font-size: 13px; color: #f0f3fa; }
.pipe-nav { display: flex; justify-content: space-between; flex: none; }
.handoff { font-size: 12px; color: var(--muted); border-left: 2px solid var(--blue); padding: 2px 0 2px 10px; margin: 12px 0 0; }

/* ---- responsive ---- */
@media (max-width: 920px) {
  .mdig { height: auto; }
  .layers { grid-template-columns: 1fr; }
  .g-wrap { grid-template-columns: 1fr; }
  .g-side { overflow: visible; }
  .g-canvas { height: 520px; flex: none; }
  .mdig-view { min-height: 0; }
  .pipe-impact { grid-template-columns: 1fr; }
}
</style>
</head>

  }

    nEnter.append("text").attr("x", function (d) { return rad(d) + 3; }).attr("y", 4).text(function (d) { return d.name; });

  function shorten(a, b, by) { var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1; return { x: b.x - dx / len * by, y: b.y - dy / len * by }; }

  function buildMatrix() {

  }

  // ---- controls wiring (full mode) ----

  // ---- init ----
  renderGraph(); rebuildNeighbors();
  sim.alpha(1).restart(); for (var t = 0; t < 140; t++) sim.tick(); sim.stop();
  setView(view);
  var initScn = null;
  if (opts.scenarioId) { (data.scenarios || []).forEach(function (s) { if (s.id === opts.scenarioId) initScn = s; }); }
  setScenario(initScn);

  return {
    setScenario: setScenario,
    setView: setView,
    destroy: function () { window.removeEventListener("resize", onResize); container.innerHTML = ""; }
  };
};

/* Cluster shell: loads embedded site data, routes between views, renders Overview,
   Pipeline (the 4-stage walkthrough), the Graph tab (mounts MDIGGraph), and stubs. */
(function () {
  var dataEl = document.getElementById("site-data");
  var DATA = JSON.parse(dataEl.textContent);
  var viewEl = document.getElementById("mdig-view");
  var NAME = new Map(DATA.catalog.nodes.map(function (n) { return [n.id, n.name]; }));
  function nm(id) { return NAME.get(id) || id; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  var TABS = [
    { id: "overview", label: "Overview" },
    { id: "pipeline", label: "Pipeline" },
    { id: "control", label: "Control Plane", soon: true },
    { id: "graph", label: "Graph" },
    { id: "notes", label: "Notes", soon: true }
  ];
  var current = "overview";
  var pipe = { scn: 0, stage: 0 };
  var graphApi = null, pipeGraph = null;

  // ---- nav ----
  var nav = document.getElementById("mdig-nav");
  TABS.forEach(function (t) {
    var b = document.createElement("button");
    b.innerHTML = t.label + (t.soon ? "<span class='soon'>soon</span>" : "");
    b.setAttribute("data-tab", t.id);
    if (t.soon) b.disabled = false; // navigable but shows a stub
    b.addEventListener("click", function () { go(t.id); });
    nav.appendChild(b);
  });
  function syncNav() { nav.querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === current); }); }

  function destroyGraphs() {
    if (graphApi) { graphApi.destroy(); graphApi = null; }
    if (pipeGraph) { pipeGraph.destroy(); pipeGraph = null; }
  }
  function go(tab) { current = tab; if (location.hash !== "#" + tab) location.hash = tab; syncNav(); render(); }

  function render() {
    destroyGraphs();
    viewEl.innerHTML = "";
    if (current === "overview") renderOverview();
    else if (current === "pipeline") renderPipeline();
    else if (current === "graph") renderGraphTab();
    else renderStub(current);
  }

  // ---- overview ----
  function renderOverview() {
    var q = DATA.queue, rev = q.filter(function (x) { return x.review_required; }).length;
    var m = DATA.evaluation.metrics;
    viewEl.innerHTML =
      '<div class="ov-grid">' +
      '<div class="ov-hero"><h2>Market-data operations, end to end</h2>' +
      "<p>A role-inspired proof of concept: a vendor or exchange notice is classified, mapped to everything it touches inside the firm, and turned into a routed, reviewable action \u2014 with a safety metric at each step. All data here is synthetic.</p></div>" +
      '<div class="ov-stats">' +
      stat(DATA.catalog.nodes.length, "graph nodes") + stat(DATA.catalog.links.length, "dependencies") +
      stat(q.length, "notices") + stat(rev, "need review") + stat(q.length - rev, "auto-cleared") +
      stat(m.false_clears, "false clears", true) + "</div>" +
      '<div class="layers">' +
      layer("Layer 1", "Notification Router", "What is this notice?", "Ingests messy vendor / exchange notices and classifies them into structured events \u2014 type, venue, asset class, urgency \u2014 deciding what needs a human.", "false auto-accepts = 0") +
      layer("Layer 2", "Impact Graph", "What does it affect?", "Maps each notice onto an internal dependency graph and computes the full downstream impact: datasets, systems, desks, owners, contracts, entitlements.", "false clears = 0", "l2") +
      layer("Layer 3", "Ops Control Plane", "What do we do next?", "Turns impact into operations: a review queue, owner routing, risk overview, and quality metrics \u2014 the operator's view across every notice.", "this site") +
      "</div>" +
      '<div class="ov-cta"><button class="btn primary" data-go="pipeline">Start the walkthrough \u2192</button>' +
      '<button class="btn" data-go="graph">Explore the graph</button>' +
      '<span class="mdig-syn">Synthetic, role-inspired data \u2014 not affiliated with any firm, vendor, or exchange.</span></div>' +
      "</div>";
    viewEl.querySelectorAll("[data-go]").forEach(function (b) { b.addEventListener("click", function () { go(b.getAttribute("data-go")); }); });
  }
  function stat(v, label, good) { return '<div class="ov-stat' + (good ? " good" : "") + '"><b>' + v + "</b><span>" + label + "</span></div>"; }
  function layer(n, title, q, body, metric, cls) {
    return '<div class="layer ' + (cls || "") + '"><span class="lnum">' + n + '</span><h3>' + title + '</h3><div class="q">' + q + "</div><p>" + body + '</p><div class="metric">' + metric + "</div></div>";
  }

  // ---- pipeline ----
  var STEPS = ["Raw notice", "Router output", "Impact", "Decision"];
  function renderPipeline() {
    var html =
      '<div class="pipe"><div class="pipe-top">' +
      '<div class="pipe-scn" data-ref="pscn"></div>' +
      '<div class="pipe-steps" data-ref="psteps"></div></div>' +
      '<div class="pipe-body" data-ref="pbody"></div>' +
      '<div class="pipe-nav"><button class="btn" data-ref="pprev">\u2190 Back</button><button class="btn primary" data-ref="pnext">Next \u2192</button></div></div>';
    viewEl.innerHTML = html;
    var pscn = viewEl.querySelector('[data-ref="pscn"]');
    DATA.scenarios.forEach(function (s, i) {
      var b = document.createElement("button");
      b.textContent = s.label; b.setAttribute("data-i", i);
      b.addEventListener("click", function () { pipe.scn = i; pipe.stage = 0; updatePipe(); });
      pscn.appendChild(b);
    });
    var psteps = viewEl.querySelector('[data-ref="psteps"]');
    STEPS.forEach(function (label, i) {
      var wrap = document.createElement("span"); wrap.className = "pipe-step";
      var b = document.createElement("button");
      b.innerHTML = "<span class='n'>" + (i + 1) + "</span>" + label; b.setAttribute("data-s", i);
      b.addEventListener("click", function () { pipe.stage = i; updatePipe(); });
      wrap.appendChild(b); psteps.appendChild(wrap);
      if (i < STEPS.length - 1) { var a = document.createElement("span"); a.className = "pipe-arrow"; a.textContent = "\u2192"; psteps.appendChild(a); }
    });
    viewEl.querySelector('[data-ref="pprev"]').addEventListener("click", function () { if (pipe.stage > 0) { pipe.stage--; updatePipe(); } });
    viewEl.querySelector('[data-ref="pnext"]').addEventListener("click", function () { if (pipe.stage < STEPS.length - 1) { pipe.stage++; updatePipe(); } });
    updatePipe();
  }
  function updatePipe() {
    if (pipeGraph) { pipeGraph.destroy(); pipeGraph = null; }
    var scn = DATA.scenarios[pipe.scn];
    viewEl.querySelectorAll(".pipe-scn button").forEach(function (b) { b.classList.toggle("active", +b.getAttribute("data-i") === pipe.scn); });
    viewEl.querySelectorAll(".pipe-step button").forEach(function (b) { var i = +b.getAttribute("data-s"); b.classList.toggle("active", i === pipe.stage); b.classList.toggle("done", i < pipe.stage); });
    viewEl.querySelector('[data-ref="pprev"]').disabled = pipe.stage === 0;
    viewEl.querySelector('[data-ref="pnext"]').disabled = pipe.stage === STEPS.length - 1;
    var body = viewEl.querySelector('[data-ref="pbody"]');
    if (pipe.stage === 0) body.innerHTML = stageRaw(scn);
    else if (pipe.stage === 1) body.innerHTML = stageRouter(scn);
    else if (pipe.stage === 2) { body.innerHTML = stageImpact(scn); pipeGraph = MDIGGraph(body.querySelector('[data-ref="pgraph"]'), DATA, { controls: false, scenarioId: scn.id }); }
    else body.innerHTML = stageDecision(scn);
  }
  function stageRaw(scn) {
    return '<div class="card"><p class="section-label">Stage 1 \u00b7 Raw inbound notice</p>' +
      '<pre class="pipe-raw">' + esc(scn.raw_text) + "</pre>" +
      '<p class="pipe-hint">This is the kind of unstructured message a market-data team receives. Layer 1 (the notification router) reads it and produces the structured event in the next stage.</p></div>';
  }
  function stageRouter(scn) {
    var r = scn.router_output;
    var nr = r.needs_review ? "<span class='badge review'>needs review</span>" : "<span class='badge clear'>no review</span>";
    return '<div class="card"><p class="section-label">Stage 2 \u00b7 Router output (Layer 1)</p>' +
      '<div class="kv">' +
      kv("notice type", r.notice_type) + kv("source", r.source) + kv("venue", r.affected_exchange) +
      kv("asset class", r.affected_asset_class) + kv("effective date", r.effective_date) + kv("urgency", r.urgency) +
      kv("confidence", r.confidence) + kv("router flag", nr) + "</div>" +
      '<p class="handoff">Handoff to Layer 2: the venue and asset class are what the impact graph resolves to a feed. Note the router\u2019s review flag \u2014 the graph can override it.</p></div>';
  }
  function kv(k, v) { return '<div class="k">' + k + '</div><div class="v">' + v + "</div>"; }
  function stageImpact(scn) {
    var im = scn.impact;
    var side =
      group("Matched feed", im.unknown_feed ? "<span class='tag'>none \u2014 unknown venue</span>" : tags(im.matched_feeds, "feed")) +
      group("Datasets", tags(im.datasets)) +
      group("Systems", tags(im.systems)) +
      group("Desks", tags(im.desks)) +
      group("Owners notified", tags(im.responder_owners)) +
      group("Risks", scn.risk.risks.length ? scn.risk.risks.map(function (x) { return "<div class='risk'>" + esc(x.detail) + "</div>"; }).join("") : "<div class='risk none'>no risks</div>");
    return '<div class="card"><p class="section-label">Stage 3 \u00b7 Impact (Layer 2)</p>' +
      '<div class="pipe-impact"><div class="pipe-graph" data-ref="pgraph"></div>' +
      '<div class="pipe-side">' + side + "</div></div></div>";
  }
  function group(title, inner) { return '<div class="grp"><h5>' + title + '</h5><div class="pipe-tags">' + inner + "</div></div>"; }
  function tags(ids, cls) {
    if (!ids || !ids.length) return "<span class='tag'>none</span>";
    return ids.map(function (id) { return "<span class='tag " + (cls || "") + "'>" + esc(nm(id)) + "</span>"; }).join("");
  }
  function stageDecision(scn) {
    var r = scn.risk, im = scn.impact, t = scn.ticket;
    var review = r.review_required ? "<span class='badge review'>review required</span>" : "<span class='badge clear'>auto-cleared</span>";
    var conf = im.unknown_feed ? "<span class='badge nomatch'>no catalog match</span>" : "<span class='badge conf'>match " + im.graph_match_confidence.toFixed(2) + "</span>";
    var ticket =
      '<div class="pipe-ticket"><h5>Enriched review ticket (Layer 3 input)</h5><div class="kv">' +
      kv("title", esc(t.title)) + kv("priority", t.priority) + kv("assignees", (t.assignees || []).join(", ") || "\u2014") +
      kv("due date", t.due_date || "\u2014") + kv("action", esc(t.recommended_action)) +
      kv("router conf.", t.audit.router_confidence) + kv("graph conf.", t.audit.graph_match_confidence) +
      kv("review", String(t.audit.review_required)) + "</div></div>";
    return '<div class="card"><p class="section-label">Stage 4 \u00b7 Decision &amp; ticket (Layer 3)</p>' +
      '<div class="g-panel"><div class="badges">' + review + "<span class='badge prio-" + r.priority + "'>" + r.priority + " priority</span>" + conf + "</div>" +
      '<div class="action">' + esc(r.recommended_action) + "</div></div>" + ticket +
      (r.review_required ? '<p class="pipe-hint">This ticket lands in the Control Plane queue for a human to action.</p>' : '<p class="pipe-hint">No risks and a clean match: the system clears this notice without a human \u2014 and the evaluation confirms it never clears one that should have been reviewed.</p>') +
      "</div>";
  }

  // ---- graph tab ----
  function renderGraphTab() {
    var c = document.createElement("div"); c.style.height = "100%";
    viewEl.appendChild(c);
    graphApi = MDIGGraph(c, DATA, { controls: true });
  }

  // ---- stubs ----
  function renderStub(tab) {
    var t = TABS.filter(function (x) { return x.id === tab; })[0] || { label: tab };
    var next = tab === "control"
      ? "The operator dashboard \u2014 review queue, risk overview, the catalog audit, and the evaluation metrics \u2014 is the next build (Phase D)."
      : "The ecosystem write-up and condensed architecture notes are coming (Phase E).";
    viewEl.innerHTML = '<div class="stub"><h2>' + t.label + "</h2><p>" + next + " For now, explore the Pipeline and the Graph.</p></div>";
  }

  // ---- boot ----
  function fromHash() { var h = (location.hash || "").replace("#", ""); return TABS.some(function (t) { return t.id === h; }) ? h : "overview"; }
  window.addEventListener("hashchange", function () { var h = fromHash(); if (h !== current) { current = h; syncNav(); render(); } });
  current = fromHash();
  syncNav();
  render();
})();
</script>
</body>
</html>
