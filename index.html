<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Market-data operations toolkit — Lucas Hsu</title>
<meta name="description" content="An interactive D3 walkthrough of a market-data operations toolkit: feed health, order-book layers, and latency budgets." />
<script src="d3.min.js"></script>
<style>/* ============================================================
   Market-data impact graph — cluster styles (dark, TradingView-ish)
   Scoped under .mdig so it can live as a section of a personal site.
   ============================================================ */
.mdig {
  --bg: #0c0e15; --panel: #131722; --panel-2: #161b27; --line: #2a2e39;
  --ink: #d1d4dc; --muted: #868a96; --flow: #5b6472; --gov: #444b59;
  --up: #26a69a; --down: #ef5350; --blue: #2962ff;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Trebuchet MS", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  height: 100vh; display: flex; flex-direction: column;
  padding: 16px 18px 12px; max-width: 1320px; margin: 0 auto;
}
.mdig *, .mdig *::before, .mdig *::after { box-sizing: border-box; }

/* ---- header ---- */
.mdig-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; flex: none; }
.mdig-head h1 { margin: 0 0 2px; font-size: 21px; letter-spacing: -0.01em; color: #f0f3fa; }
.mdig-head p { margin: 0; color: var(--muted); max-width: 700px; font-size: 13px; }
.mdig-byline { font-size: 13px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
.mdig-byline strong { color: var(--ink); font-weight: 600; }
.mdig-syn { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }

/* ---- nav tabs ---- */
.mdig-nav { display: flex; gap: 4px; flex: none; margin: 14px 0 12px; flex-wrap: wrap; }
.mdig-nav button { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .12s ease; }
.mdig-nav button:hover { border-color: #3d434f; background: #1b2130; }
.mdig-nav button.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.mdig-nav button:disabled { opacity: .45; cursor: default; }
.mdig-nav button .soon { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-left: 5px; }

/* ---- view container ---- */
.mdig-view { flex: 1 1 auto; min-height: 0; }
.mdig-foot { margin-top: 8px; flex: none; color: var(--muted); font-size: 11px; }

/* ---- shared components ---- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
.badge { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; font-family: var(--mono); display: inline-block; }
.badge.review { background: rgba(239,83,80,.16); color: #ff6b66; border: 1px solid rgba(239,83,80,.35); }
.badge.clear { background: rgba(38,166,154,.16); color: #4cd2c4; border: 1px solid rgba(38,166,154,.35); }
.badge.prio-high { background: rgba(239,83,80,.16); color: #ff6b66; }
.badge.prio-medium { background: rgba(255,159,10,.16); color: #ffb84d; }
.badge.prio-low { background: rgba(38,166,154,.16); color: #4cd2c4; }
.badge.conf { background: rgba(41,98,255,.18); color: #6f93ff; }
.badge.nomatch { background: rgba(120,123,134,.18); color: #aab0bb; }
.counts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.count { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 12px; color: var(--muted); }
.count b { font-size: 17px; display: block; color: var(--ink); font-family: var(--mono); }
.risk { font-size: 12.5px; padding: 6px 9px; border-radius: 7px; background: rgba(255,159,10,.08); border: 1px solid rgba(255,159,10,.25); color: #ffc06b; margin-bottom: 5px; }
.risk.none { background: rgba(38,166,154,.08); border-color: rgba(38,166,154,.25); color: #6fdccf; }
.btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .12s ease; }
.btn:hover { border-color: #3d434f; background: #1b2130; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: #1e54e6; }

/* ---- overview ---- */
.ov-grid { display: grid; gap: 14px; height: 100%; grid-template-rows: auto auto 1fr; min-height: 0; overflow-y: auto; }
.ov-hero h2 { margin: 2px 0 6px; font-size: 22px; color: #f0f3fa; }
.ov-hero p { margin: 0; color: #aab0bb; font-size: 14px; max-width: 760px; }
.ov-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.ov-stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.ov-stat b { display: block; font-size: 22px; font-family: var(--mono); color: #f0f3fa; }
.ov-stat span { font-size: 12px; color: var(--muted); }
.ov-stat.good b { color: #4cd2c4; }
.layers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.layer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; }
.layer .lnum { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.layer h3 { margin: 4px 0 2px; font-size: 15px; color: #f0f3fa; }
.layer .q { color: var(--muted); font-size: 12.5px; font-style: italic; margin-bottom: 8px; }
.layer p { margin: 0 0 10px; font-size: 12.5px; color: #aab0bb; }
.layer .metric { margin-top: auto; font-size: 12px; font-family: var(--mono); color: #4cd2c4; background: rgba(38,166,154,.1); border: 1px solid rgba(38,166,154,.25); border-radius: 7px; padding: 6px 8px; }
.layer.l2 { border-color: rgba(41,98,255,.4); }
.ov-cta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---- placeholder (stub views) ---- */
.stub { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; color: var(--muted); }
.stub h2 { color: var(--ink); margin: 0 0 6px; }
.stub p { max-width: 420px; }


/* ---- control plane ---- */
.cp-grid { display: grid; gap: 14px; height: 100%; grid-auto-rows: max-content; overflow-y: auto; min-height: 0; padding-right: 3px; }
.cp-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.qtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.qtable th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.qtable td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.qtable tr:last-child td { border-bottom: 0; }
.qtable a { color: #6f93ff; text-decoration: none; }
.qtable a:hover { text-decoration: underline; }
.qtable .sub { display: block; color: var(--muted); font-size: 11px; font-family: var(--mono); }
.split-tag { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.split-tag.held { border-color: rgba(41,98,255,.5); color: #6f93ff; }
/* --- click-to-route breakdown ------------------------------------------- */
.qtable tr.qrow { cursor: pointer; }
.qtable tr.qrow:hover td { background: var(--panel-2); }
.qtable tr.qrow.open td { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--blue); }
.qtable .caret { display: inline-block; width: 12px; color: var(--muted); font-family: var(--mono); }
.rt { padding: 0 !important; }
/* The breakdown lives in a <td> inside the queue table, which scrolls
   horizontally on narrow screens. Sticky-left pins the panel to the visible
   edge so it stays readable without sideways scrolling, and the width cap
   stops it inheriting the full table width. */
.rt-inner { padding: 14px 12px 16px; display: grid; gap: 12px; position: sticky; left: 0; box-sizing: border-box; width: 100%; max-width: calc(100vw - 40px); }
.rt-stage { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; background: var(--panel); opacity: 0; transform: translateY(6px); animation: rt-in .28s ease forwards; }
@keyframes rt-in { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .rt-stage { animation: none; opacity: 1; transform: none; } }
.rt-stage > h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }
.rt-text { font-size: 12.5px; line-height: 1.6; color: #c4cad6; }
.rt-text mark { background: rgba(41,98,255,.22); color: #cfe0ff; border-radius: 3px; padding: 0 2px; }
.rt-fields { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; align-items: baseline; }
.rt-fields .fk { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.rt-fields .fv { font-family: var(--mono); }
/* Verdict marks are shape-coded as well as colour-coded: red/green alone is
   not a distinction every reader can make. */
.mark-ok::before { content: "\2713\00a0"; color: var(--up); }
.mark-bad::before { content: "\2717\00a0"; color: var(--down); }
.mark-bad { color: var(--down); }
.rt-board { display: grid; gap: 4px; }
.rt-bar { display: grid; grid-template-columns: 130px 1fr 30px; gap: 8px; align-items: center; font-size: 11.5px; font-family: var(--mono); }
.rt-bar .lbl { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
/* display:block matters — these are spans, and width/height are ignored on
   inline boxes, so the bars render at zero width without it. */
.rt-bar .track { display: block; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.rt-bar .fill { display: block; height: 100%; min-width: 2px; background: rgba(120,140,170,.5); border-radius: 4px; }
.rt-bar.win .lbl { color: var(--ink); }
.rt-bar.win .fill { background: var(--blue); }
.rt-bar .num { text-align: right; color: var(--muted); }
.rt-graph { height: 260px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
/* The flow view needs room for five column labels; under ~560px they collide.
   The same information is listed instead — a legible list beats a broken chart. */
.rt-graph-alt { display: none; font-size: 12px; }
@media (max-width: 560px) {
  .rt-graph { display: none; }
  .rt-graph-alt { display: block; }
}
.rt-verdict { font-size: 12px; border-radius: 8px; padding: 8px 10px; border: 1px solid var(--line); }
.rt-verdict.good { border-color: rgba(76,210,196,.4); color: #9fe0c6; }
.rt-verdict.bad { border-color: rgba(239,83,80,.55); color: #ff9b98; }
.rt-why { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
@media (max-width: 720px) {
  .rt-bar { grid-template-columns: 92px 1fr 26px; }
  .rt-fields { grid-template-columns: 1fr; gap: 2px 0; }
  .rt-fields .fk { margin-top: 6px; }
}
.fail-item { border-left: 3px solid rgba(255,159,10,.6); padding: 8px 10px; margin-bottom: 8px; background: var(--panel-2); border-radius: 0 8px 8px 0; font-size: 12.5px; color: #aab0bb; }
.fail-item.danger { border-left-color: rgba(239,83,80,.8); }
.fail-item b { color: var(--ink); }
.fail-item .why { display: block; margin-top: 3px; font-size: 12px; }
.audit-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.audit-check { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 12px; color: var(--muted); }
.audit-check b { display: block; color: var(--ink); font-size: 12.5px; margin-bottom: 3px; }
.audit-check .ids { font-family: var(--mono); font-size: 11.5px; color: #ffc06b; }
.audit-check.clean .ids { color: #6fdccf; }
.notes-body { max-width: 800px; overflow-y: auto; height: 100%; color: #aab0bb; font-size: 13.5px; line-height: 1.65; padding-right: 8px; }
.notes-body h2 { color: #f0f3fa; font-size: 18px; margin: 18px 0 6px; }
.notes-body h2:first-child { margin-top: 2px; }
.notes-body code { font-family: var(--mono); font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.notes-body a { color: #6f93ff; }

/* ============================================================
   Graph module (mounted by graph.js); classes prefixed g-
   ============================================================ */
.g-wrap { display: grid; grid-template-columns: 250px 1fr; gap: 14px; height: 100%; min-height: 0; }
.g-wrap.focused { grid-template-columns: 1fr; }
.g-side { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding-right: 3px; }
.g-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.g-scnlist { display: flex; flex-direction: column; gap: 4px; }
.g-scn { text-align: left; border: 1px solid transparent; background: var(--panel-2); color: var(--ink); padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; transition: background .12s ease; }
.g-scn:hover { background: #1b2130; }
.g-scn.active { background: var(--blue); color: #fff; }
.g-scn .m { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.g-scn.active .m { color: rgba(255,255,255,.75); }
.g-views { display: flex; gap: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.g-views button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.g-views button.active { background: #2a3040; color: #fff; }
.g-quick { display: flex; gap: 5px; margin-bottom: 9px; }
.g-quick button { flex: 1; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 11.5px; }
.g-quick button:hover { color: var(--ink); border-color: #3d434f; }
.g-types { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; }
.g-type { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); cursor: pointer; user-select: none; }
.g-type input { accent-color: var(--blue); width: 13px; height: 13px; margin: 0; cursor: pointer; }
.g-type .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.g-type.off { color: var(--muted); }
.g-type.off .dot { opacity: .3; }
.g-elegend { margin-top: 10px; font-size: 11px; color: var(--muted); display: flex; gap: 14px; }
.g-elegend .e { display: inline-flex; align-items: center; gap: 5px; }
.g-elegend .ln { width: 18px; border-top: 2px solid var(--flow); }
.g-elegend .ln.g { border-top: 2px dashed var(--gov); }

.g-main { display: flex; flex-direction: column; min-height: 0; }
.g-note { color: var(--muted); font-size: 12px; margin: 0 0 8px; min-height: 18px; }
.g-note b { color: #aab0bb; font-weight: 600; }
.g-canvas {
  position: relative; flex: 1 1 auto; min-height: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background:
    repeating-linear-gradient(0deg, transparent 0, transparent 39px, rgba(255,255,255,.020) 39px, rgba(255,255,255,.020) 40px),
    repeating-linear-gradient(90deg, transparent 0, transparent 39px, rgba(255,255,255,.020) 39px, rgba(255,255,255,.020) 40px),
    var(--panel);
}
.g-canvas svg { display: block; width: 100%; height: 100%; cursor: grab; }
.g-canvas svg:active { cursor: grabbing; }
.g-canvas .node circle { transition: opacity .25s ease, stroke .2s ease; }
.g-canvas .node text { font-size: 10px; fill: #c7ccd6; paint-order: stroke; stroke: #0c0e15; stroke-width: 3px; pointer-events: none; }
.g-canvas .links path { fill: none; transition: opacity .25s ease; }
.g-canvas .node.dim circle, .g-canvas .node.dim text { opacity: .07; }
.g-canvas .links path.dim { opacity: .04; }
.g-canvas .col-head { fill: #8b919c; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.g-canvas .col-rule { stroke: var(--line); stroke-dasharray: 2 4; }
.g-canvas .mx-grid line { stroke: rgba(255,255,255,.04); }
.g-canvas .mx-sep { stroke: #353b48; stroke-width: 1; }
.g-canvas .mx-grp { fill: #8b919c; font-size: 10px; font-weight: 600; }
.g-canvas .cell { transition: opacity .2s ease; }
.g-canvas .cell.dim { opacity: .05; }
.g-zoombar { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.g-zoombar button { width: 28px; height: 28px; border: 1px solid var(--line); background: rgba(22,27,39,.85); color: var(--ink); border-radius: 6px; cursor: pointer; font-size: 15px; line-height: 1; }
.g-zoombar button:hover { background: #1b2130; }
.g-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; pointer-events: none; text-align: center; padding: 20px; }
.g-overlay .t { color: #ff6b66; font-weight: 700; font-size: 15px; }
.g-overlay .s { color: var(--muted); font-size: 12.5px; margin-top: 4px; max-width: 340px; }
.g-panel h4 { margin: 0 0 2px; font-size: 15px; color: #f0f3fa; }
.g-panel .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
.g-panel .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.g-panel .meta { font-size: 12.5px; color: #9aa0aa; }
.g-panel .action { margin-top: 12px; font-size: 12.5px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.g-panel .counts { margin-bottom: 14px; }

.g-tooltip { position: fixed; pointer-events: none; background: #1c2230; color: var(--ink); border: 1px solid var(--line); padding: 7px 10px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .1s; max-width: 250px; z-index: 50; box-shadow: 0 8px 26px rgba(0,0,0,.45); }
.g-tooltip strong { color: #f0f3fa; }
.g-tooltip .tt { color: var(--muted); font-size: 11px; }

/* ---- pipeline (walkthrough) ---- */
.pipe { display: flex; flex-direction: column; height: 100%; min-height: 0; gap: 12px; }
.pipe-top { flex: none; }
.pipe-scn { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.pipe-scn button { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 12.5px; }
.pipe-scn button:hover { background: #1b2130; }
.pipe-scn button.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.pipe-steps { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.pipe-step button { border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; display: inline-flex; gap: 7px; align-items: center; }
.pipe-step button .n { width: 18px; height: 18px; border-radius: 50%; background: var(--line); color: var(--ink); font-size: 11px; font-family: var(--mono); display: inline-flex; align-items: center; justify-content: center; }
.pipe-step button.active { border-color: var(--blue); color: #fff; background: rgba(41,98,255,.15); }
.pipe-step button.active .n { background: var(--blue); color: #fff; }
.pipe-step button.done { color: var(--ink); }
.pipe-arrow { color: var(--muted); margin: 0 7px; }
.pipe-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.pipe-raw { background: #0e1118; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 12px; color: #aab0bb; white-space: pre-wrap; margin: 0; }
.pipe-hint { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 13px; align-items: baseline; }
.kv .k { color: var(--muted); }
.kv .v { color: var(--ink); font-family: var(--mono); word-break: break-word; }
.pipe-impact { display: grid; grid-template-columns: 1fr 300px; gap: 14px; }
.pipe-graph { height: 380px; }
.pipe-side h5 { margin: 0 0 6px; font-size: 12.5px; color: #f0f3fa; }
.pipe-side .grp { margin-bottom: 12px; }
.pipe-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11.5px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--ink); }
.tag.feed { border-color: rgba(41,98,255,.5); }
.pipe-ticket { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; }
.pipe-ticket h5 { margin: 0 0 8px; font-size: 13px; color: #f0f3fa; }
.pipe-nav { display: flex; justify-content: space-between; flex: none; }
.handoff { font-size: 12px; color: var(--muted); border-left: 2px solid var(--blue); padding: 2px 0 2px 10px; margin: 12px 0 0; }

/* ---- responsive ---- */
@media (max-width: 920px) {
  .mdig { height: auto; }
  .layers { grid-template-columns: 1fr; }
  .g-wrap { grid-template-columns: 1fr; }
  .g-side { overflow: visible; }
  .g-canvas { height: 520px; flex: none; }
  .mdig-view { min-height: 0; }
  .pipe-impact { grid-template-columns: 1fr; }
}

<script>/* MDIGGraph: mount the impact-graph visualiser into a container.
   Usage: var api = MDIGGraph(containerEl, siteData, { controls:true, scenarioId:null });
          api.setScenario(scenarioObj | null); api.setView('flow'|'force'|'matrix'); api.destroy();
   Consumes siteData.catalog {nodes, links} and siteData.scenarios (site_data shape). */
window.MDIGGraph = function (container, data, opts) {
  opts = opts || {};
  var controls = opts.controls !== false;

  var COLORS = { venue: "#868a96", vendor: "#aab0bb", feed: "#2962ff", dataset: "#22d3ee", system: "#ff9f0a", desk: "#bb86fc", owner: "#5ed17a", contract: "#ef5350", entitlement: "#ff5fa2" };
  var TYPE_ORDER = ["venue", "vendor", "feed", "dataset", "system", "desk", "owner", "contract", "entitlement"];
  var TYPE_LABEL = { venue: "Venue", vendor: "Vendor", feed: "Feed", dataset: "Dataset", system: "System", desk: "Desk", owner: "Owner", contract: "Contract", entitlement: "Entitlement" };
  var CORE = ["venue", "vendor", "feed", "dataset", "system", "desk"];
  var COL = { venue: 0, vendor: 0, feed: 1, dataset: 2, system: 3, desk: 4 };
  var GOVT = new Set(["owner", "contract", "entitlement"]);
  var REVERSE = new Set(["derived_from", "depends_on"]);
  var COL_HEADS = ["Source", "Feeds", "Datasets", "Systems", "Desks"];
  var NOTES = {
    flow: "<b>Flow view.</b> Data flows left &rarr; right: source &rarr; feeds &rarr; datasets &rarr; systems &rarr; desks. Solid lines are data flow; dashed lines show governance attached below. A notice enters at a feed and cascades rightward.",
    force: "<b>Force view.</b> An organic layout where clusters emerge from the structure. Drag nodes; hover one to focus its neighbours. Use the type filter to isolate part of the graph.",
    matrix: "<b>Matrix view.</b> A filled cell means the row item feeds into the column item. Grouped by type, so the feed&rarr;dataset&rarr;system&rarr;desk structure forms off-diagonal blocks."
  };

  // ---- skeleton ----
  var sideHTML = controls
    ? '<div class="g-side">' +
      '<div class="g-sec"><p class="section-label">Scenarios</p><div class="g-scnlist" data-ref="scns"></div></div>' +
      '<div class="g-sec"><p class="section-label">Layout</p><div class="g-views" data-ref="views">' +
      '<button data-view="flow" class="active">Flow</button><button data-view="force">Force</button><button data-view="matrix">Matrix</button></div></div>' +
      '<div class="g-sec"><p class="section-label">Show types</p>' +
      '<div class="g-quick"><button data-ref="qall">All</button><button data-ref="qcore">Core flow</button></div>' +
      '<div class="g-types" data-ref="types"></div>' +
      '<div class="g-elegend"><span class="e"><span class="ln"></span>flow</span><span class="e"><span class="ln g"></span>governance</span></div></div>' +
      '<div class="g-sec g-panel" data-ref="panel"></div></div>'
    : "";
  var noteHTML = controls ? '<div class="g-note" data-ref="note"></div>' : "";
  container.innerHTML =
    '<div class="g-wrap' + (controls ? "" : " focused") + '">' + sideHTML +
    '<div class="g-main">' + noteHTML +
    '<div class="g-canvas" data-ref="canvas"><svg data-ref="svg"></svg>' +
    '<div class="g-overlay" data-ref="overlay"></div>' +
    '<div class="g-zoombar"><button data-ref="zin" title="Zoom in">+</button><button data-ref="zout" title="Zoom out">\u2212</button><button data-ref="zreset" title="Reset">\u21ba</button></div>' +
    "</div></div></div>";

  function ref(n) { return container.querySelector('[data-ref="' + n + '"]'); }
  var svgEl = ref("svg"), canvasEl = ref("canvas"), overlay = ref("overlay"), noteEl = ref("note"), panelEl = ref("panel");
  var tooltip = document.createElement("div"); tooltip.className = "g-tooltip"; container.appendChild(tooltip);

  // ---- data ----
  var allNodes = data.catalog.nodes.map(function (d) { return Object.assign({}, d); });
  var allLinks = data.catalog.links.map(function (d) { return Object.assign({}, d, { sid: d.source, tid: d.target }); });
  var byId = new Map(allNodes.map(function (n) { return [n.id, n]; }));
  var deg = {};
  allLinks.forEach(function (l) { deg[l.sid] = (deg[l.sid] || 0) + 1; deg[l.tid] = (deg[l.tid] || 0) + 1; });
  allNodes.forEach(function (n) { n.degree = deg[n.id] || 0; });
  function rad(d) { return 6 + Math.sqrt(d.degree) * 2.1; }
  var visibleTypes = new Set(TYPE_ORDER);
  var nodes = allNodes.slice(), links = allLinks.slice(), neighbors = new Map();

  var width = canvasEl.clientWidth || 820, height = canvasEl.clientHeight || 520;
  var svg = d3.select(svgEl).attr("viewBox", [0, 0, width, height]);
  var defs = svg.append("defs");
  var glow = defs.append("filter").attr("id", "g-glow").attr("x", "-60%").attr("y", "-60%").attr("width", "220%").attr("height", "220%");
  glow.append("feGaussianBlur").attr("stdDeviation", "1.6").attr("result", "b");
  var fm = glow.append("feMerge"); fm.append("feMergeNode").attr("in", "b"); fm.append("feMergeNode").attr("in", "SourceGraphic");
  defs.append("marker").attr("id", "g-arrow").attr("viewBox", "0 -5 10 10").attr("refX", 8).attr("refY", 0).attr("markerWidth", 7).attr("markerHeight", 7).attr("orient", "auto").append("path").attr("d", "M0,-3.4L7,0L0,3.4").attr("fill", "#727b8a");
  var gMain = svg.append("g");
  var zoomB = d3.zoom().scaleExtent([1, 4]).translateExtent([[0, 0], [width, height]]).on("zoom", function (e) { gMain.attr("transform", e.transform); });
  svg.call(zoomB);
  var gHeaders = gMain.append("g"), gEdges = gMain.append("g").attr("class", "links"), gNodes = gMain.append("g");
  var gMatrix = gMain.append("g").attr("class", "matrix").style("display", "none");

  var hoveredId = null, view = opts.view || "flow";
  var active = null, activeSet = null, originSet = new Set();
  var nodeSel = d3.select(null), edgeSel = d3.select(null), cellSel = null;

  function showTip(e, html) { tooltip.innerHTML = html; tooltip.style.left = (e.clientX + 14) + "px"; tooltip.style.top = (e.clientY + 12) + "px"; tooltip.style.opacity = 1; }
  function hideTip() { tooltip.style.opacity = 0; }
  function nodeTip(e, d) {
    var s = "<div><strong>" + d.name + "</strong></div><div class='tt'>" + (TYPE_LABEL[d.type] || d.type);
    if (d.criticality) s += " &middot; " + d.criticality + " criticality";
    if (d.owner) s += "</div><div class='tt'>owner: " + d.owner;
    showTip(e, s + "</div>");
  }

  var drag = d3.drag()
    .on("start", function (e, d) { if (view !== "force") return; if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", function (e, d) { if (view !== "force") return; d.fx = e.x; d.fy = e.y; })
    .on("end", function (e, d) { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; });

  var sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(function (d) { return d.id; }).distance(function (l) { return l.kind === "governance" ? 66 : 54; }).strength(0.5))
    .force("charge", d3.forceManyBody().strength(-210))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide().radius(function (d) { return rad(d) + 5; }))
    .force("x", d3.forceX(width / 2).strength(0.03)).force("y", d3.forceY(height / 2).strength(0.05)).stop();

  sim.on("tick", function () {
    if (view !== "force") return;
    nodes.forEach(function (d) { var r = rad(d); d.x = Math.max(r, Math.min(width - r, d.x)); d.y = Math.max(r, Math.min(height - r, d.y)); });
    edgeSel.attr("d", function (l) { return "M" + l.source.x + "," + l.source.y + "L" + l.target.x + "," + l.target.y; });
    nodeSel.attr("transform", function (d) { return "translate(" + d.x + "," + d.y + ")"; });
  });

  function rebuildNeighbors() {
    neighbors = new Map();
    nodes.forEach(function (n) { neighbors.set(n.id, new Set([n.id])); });
    links.forEach(function (l) { neighbors.get(l.sid).add(l.tid); neighbors.get(l.tid).add(l.sid); });
  }
  function renderGraph() {
    var ns = gNodes.selectAll("g.node").data(nodes, function (d) { return d.id; });
    ns.exit().remove();
    var nEnter = ns.enter().append("g").attr("class", "node");
    nEnter.append("circle").attr("r", rad).attr("fill", function (d) { return COLORS[d.type] || "#999"; }).attr("stroke", "#0c0e15").attr("stroke-width", 1.5).attr("filter", "url(#g-glow)");
    nEnter.append("text").attr("x", function (d) { return rad(d) + 3; }).attr("y", 4).text(function (d) { return d.name; });
    nodeSel = nEnter.merge(ns);
    nodeSel.on("mousemove", nodeTip).on("mouseenter", function (e, d) { hoveredId = d.id; refresh(); }).on("mouseleave", function () { hoveredId = null; hideTip(); refresh(); }).call(drag);
    var es = gEdges.selectAll("path").data(links, function (d) { return d.sid + "|" + d.tid + "|" + d.edge_type; });
    es.exit().remove();
    var eEnter = es.enter().append("path").attr("stroke-width", 1.2).attr("opacity", 0.9).attr("stroke", function (l) { return l.kind === "governance" ? "var(--gov)" : "var(--flow)"; });
    edgeSel = eEnter.merge(es);
  }
  function applyFilter() {
    nodes = allNodes.filter(function (n) { return visibleTypes.has(n.type); });
    var ids = new Set(nodes.map(function (n) { return n.id; }));
    links = allLinks.filter(function (l) { return ids.has(l.sid) && ids.has(l.tid); });
    renderGraph(); rebuildNeighbors();
    sim.nodes(nodes); sim.force("link").links(links);
    setView(view);
  }

  function shorten(a, b, by) { var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1; return { x: b.x - dx / len * by, y: b.y - dy / len * by }; }
  function flowEnds(l) { return REVERSE.has(l.edge_type) ? [l.target, l.source] : [l.source, l.target]; }
  function flowPath(l) { var e = flowEnds(l), a = e[0], b = e[1], end = shorten(a, b, rad(b) + 7), mx = (a.x + end.x) / 2; return "M" + a.x + "," + a.y + " C " + mx + "," + a.y + " " + mx + "," + end.y + " " + end.x + "," + end.y; }
  function layoutFlow() {
    sim.stop();
    var margin = 70, topY = 56, bandTop = height * 0.74, bandBot = height - 26, innerW = width - 2 * margin;
    var cols = { 0: [], 1: [], 2: [], 3: [], 4: [] }, gov = [];
    nodes.forEach(function (n) { if (GOVT.has(n.type)) gov.push(n); else cols[COL[n.type]].push(n); });
    function srt(a, b) { return (TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type)) || d3.ascending(a.name, b.name); }
    for (var c = 0; c < 5; c++) {
      var arr = cols[c]; arr.sort(srt);
      var x = margin + innerW * c / 4;
      arr.forEach(function (n, i) { n.x = x; n.y = topY + (i + 0.5) * (bandTop - 24 - topY) / Math.max(arr.length, 1); });
    }
    gov.sort(srt);
    gov.forEach(function (n, i) { n.x = margin + (gov.length > 1 ? innerW * i / (gov.length - 1) : innerW / 2); n.y = (bandTop + bandBot) / 2; });
    nodeSel.attr("transform", function (d) { return "translate(" + d.x + "," + d.y + ")"; });
    edgeSel.attr("d", flowPath).attr("marker-end", function (l) { return l.kind === "flow" ? "url(#g-arrow)" : null; }).attr("stroke-dasharray", function (l) { return l.kind === "governance" ? "4 3" : null; });
    gHeaders.selectAll("*").remove();
    COL_HEADS.forEach(function (t, c) {
      var x = margin + innerW * c / 4;
      gHeaders.append("text").attr("class", "col-head").attr("x", x).attr("y", 26).attr("text-anchor", "middle").text(t);
      if (c > 0) gHeaders.append("line").attr("class", "col-rule").attr("x1", margin + innerW * (c - 0.5) / 4).attr("x2", margin + innerW * (c - 0.5) / 4).attr("y1", 38).attr("y2", bandTop - 26);
    });
    if (gov.length) {
      gHeaders.append("line").attr("class", "col-rule").attr("x1", margin - 24).attr("x2", width - margin + 24).attr("y1", bandTop - 14).attr("y2", bandTop - 14);
      gHeaders.append("text").attr("class", "col-head").attr("x", margin - 24).attr("y", bandTop - 20).attr("text-anchor", "start").text("Governance \u2014 attached, not traversed");
    }
  }
  function buildMatrix() {
    var sorted = nodes.slice().sort(function (a, b) { return (TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type)) || d3.ascending(a.id, b.id); });
    var N = sorted.length, m = 96;
    if (N === 0) { gMatrix.selectAll("*").remove(); cellSel = null; return; }
    var size = Math.min((width - m - 16) / N, (height - m - 16) / N);
    var idx = new Map(sorted.map(function (n, i) { return [n.id, i]; }));
    var gridW = m + N * size, offX = Math.max(0, (width - gridW) / 2);
    gMatrix.attr("transform", "translate(" + offX + ",0)").selectAll("*").remove();
    var gl = gMatrix.append("g").attr("class", "mx-grid");
    for (var i = 0; i <= N; i++) {
      gl.append("line").attr("x1", m).attr("x2", m + N * size).attr("y1", m + i * size).attr("y2", m + i * size);
      gl.append("line").attr("y1", m).attr("y2", m + N * size).attr("x1", m + i * size).attr("x2", m + i * size);
    }
    var groups = [], start = 0;
    for (var k = 1; k <= N; k++) { if (k === N || sorted[k].type !== sorted[start].type) { groups.push({ type: sorted[start].type, start: start, end: k }); start = k; } }
    groups.forEach(function (g) {

    var ev = DATA.evaluation, ho = ev.held_out.metrics, dv = ev.dev.metrics;
    var fails = ev.held_out.per_notice.filter(function (r) {
      return r.false_clear || r.unnecessary_review || !r.venue_ok || !r.type_ok || !r.priority_ok || (r.feed_recall !== null && r.feed_recall < 1);
    });
    var q = DATA.queue;
    var html = '<div class="cp-grid">';

    html += '<div class="card"><p class="section-label">Held-out evaluation · n=' + ho.n + ' real notices · split frozen before any rule was written</p><div class="ov-stats">'
      + evalStat(pct(ho.venue_accuracy), "venue accuracy", ho.venue_accuracy < 1)
      + evalStat(pct(ho.type_accuracy), "type accuracy", ho.type_accuracy < 1)
      + evalStat(pct(ho.feed_recall), "feed recall", ho.feed_recall < 1)
      + evalStat(pct(ho.priority_accuracy), "priority accuracy", ho.priority_accuracy < 1)
      + evalStat(ho.false_clears, "false clears", ho.false_clears > 0)
      + evalStat(ho.unnecessary_reviews, "unnecessary reviews", ho.unnecessary_reviews > 0)
      + '</div><p class="cp-note">Dev split (rules tuned here, n=' + dv.n + '): venue ' + pct(dv.venue_accuracy) + ' · type ' + pct(dv.type_accuracy) + ' · feed recall ' + pct(dv.feed_recall) + ' · priority ' + pct(dv.priority_accuracy) + ' · false clears ' + dv.false_clears + '. Held-out numbers are reported as scored once — not tuned.</p></div>';

    html += '<div class="card"><p class="section-label">Failure gallery · held-out misses, shown deliberately</p>';
    if (!fails.length) html += '<div class="risk none">No held-out failures.</div>';
    fails.forEach(function (r) {
      html += '<div class="fail-item' + (r.false_clear ? " danger" : "") + '"><b>' + esc(r.notice_id) + '</b>';
      failureText(r).forEach(function (t) { html += '<span class="why">' + t + '</span>'; });
      html += '</div>';
    });
    html += '<p class="cp-note">The false clear has a systemic cause worth more than the score: the escalation rule covers <i>unknown</i> products but not <i>no</i> product — a notice naming no venue and no recognisable feed cleared as a confident format change. The fix (escalate on empty feed resolution) is deliberately not applied: it was found on held-out, and rules are only tuned on dev. See Notes.</p></div>';

    html += '<div class="card"><p class="section-label">Review queue · ' + q.length + ' real notices · click any row to watch it being classified</p><div style="overflow-x:auto"><table class="qtable"><tr><th>notice</th><th>type</th><th>priority</th><th>status</th><th>split</th><th>owners</th></tr>';
    q.forEach(function (n, i) {
      html += '<tr class="qrow" data-q="' + i + '" tabindex="0" role="button" aria-expanded="false">'
        + '<td><span class="caret">›</span><a href="' + esc(n.source_url) + '" target="_blank" rel="noopener">' + esc(n.label) + '</a><span class="sub">' + esc(n.venue) + ' · ' + esc(n.notice_no) + (n.effective_date ? ' · eff ' + esc(n.effective_date) : '') + '</span></td>'
        + '<td>' + esc(n.notice_type.replace("_", " ")) + '</td>'
        + '<td><span class="badge prio-' + n.priority + '">' + n.priority + '</span></td>'
        + '<td><span class="badge ' + (n.review_required ? 'review">review' : 'clear">cleared') + '</span></td>'
        + '<td><span class="split-tag' + (n.split === "held_out" ? " held" : "") + '">' + (n.split === "held_out" ? "held-out" : "dev") + '</span></td>'
        + '<td>' + (n.assignees.join(", ") || "—") + '</td></tr>'
        + '<tr class="rt-host" data-host="' + i + '" hidden><td class="rt" colspan="6"></td></tr>';
    });
    html += '</table></div><p class="cp-note">Each row expands into what the router actually saw and how it was graded against the hand-written label. Rows are gradeable because every notice has one; held-out rows were scored once, after the rules were frozen.</p></div>';

    var a = DATA.audit;
    function check(name, ids) {
      return '<div class="audit-check' + (ids.length ? '' : ' clean') + '"><b>' + name + '</b><span class="ids">' + (ids.length ? ids.join(", ") : "clean") + '</span></div>';
    }
    html += '<div class="card"><p class="section-label">Governance audit · synthetic estate as of ' + a.config.today + ' · horizons ' + a.config.contract_expiry_days + 'd / ' + a.config.stale_days + 'd</p><div class="audit-lists">'
      + check("feeds without owner", a.feeds_without_owner)
      + check("datasets without owner", a.datasets_without_owner)
      + check("feeds without consumers", a.feeds_without_consumers)
      + check("contracts expiring", a.contracts_expiring)
      + check("expired contracts", a.expired_contracts)
      + check("entitlements expiring", a.entitlements_expiring)
      + check("expired entitlements", a.expired_entitlements)
      + check("stale metadata", a.stale_metadata)
      + '</div><p class="cp-note">Ownership and orphan checks derive from the graph; lifecycle checks run on synthetic dates authored to the estate’s reference date. Two checks remain unimplemented and say why in <code>audit.UNSUPPORTED</code>.</p></div>';

    html += '</div>';
    viewEl.innerHTML = html;
    wireQueueRows(q);
  }

  // ---- click-to-route -----------------------------------------------------
  // Expands a queue row into what the router saw, what it decided, and how it
  // was graded. Everything shown is precomputed by build_payload.py from the
  // real pipeline — the page derives no verdicts of its own.

  var rtGraph = null, rtOpen = null;

  function wireQueueRows(q) {
    viewEl.querySelectorAll("tr.qrow").forEach(function (row) {
      function toggle(e) {
        // Let the source link do its job instead of expanding the row.
        if (e && e.target && e.target.closest && e.target.closest("a")) return;
        openRow(q, +row.getAttribute("data-q"));
      }
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(e); }
      });
    });
  }

  function openRow(q, i) {
    var host = viewEl.querySelector('tr.rt-host[data-host="' + i + '"]');
    var row = viewEl.querySelector('tr.qrow[data-q="' + i + '"]');
    if (!host || !row) return;

    if (rtGraph) { rtGraph.destroy(); rtGraph = null; }
    if (rtOpen === i) { // second click closes
      host.hidden = true; host.querySelector(".rt").innerHTML = "";
      row.classList.remove("open"); row.setAttribute("aria-expanded", "false");
      rtOpen = null;
      return;
    }
    if (rtOpen !== null) {
      var prev = viewEl.querySelector('tr.rt-host[data-host="' + rtOpen + '"]');
      var prevRow = viewEl.querySelector('tr.qrow[data-q="' + rtOpen + '"]');
      if (prev) { prev.hidden = true; prev.querySelector(".rt").innerHTML = ""; }
      if (prevRow) { prevRow.classList.remove("open"); prevRow.setAttribute("aria-expanded", "false"); }
    }

    rtOpen = i;
    row.classList.add("open");
    row.setAttribute("aria-expanded", "true");
    host.hidden = false;
    host.querySelector(".rt").innerHTML = breakdownHTML(q[i]);

    // Stage the reveal so it reads as routing rather than a table unfolding.
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    host.querySelectorAll(".rt-stage").forEach(function (el, s) {
      el.style.animationDelay = reduce ? "0s" : (s * 0.11) + "s";
    });

    // Skip the mount entirely when the graph is hidden (narrow screens): a
    // force layout in a zero-width container produces NaN coordinates.
    var gEl = host.querySelector('[data-ref="rtgraph"]');
    if (gEl && gEl.clientWidth > 0) {
      rtGraph = MDIGGraph(gEl, DATA, { controls: false });
      // MDIGGraph's `scenarioId` option only looks inside DATA.scenarios, and
      // most queue rows are not worked scenarios. setScenario on the returned
      // API takes any scenario-shaped object, so drive it directly.
      rtGraph.setScenario({
        id: q[i].id,
        impact: {
          impacted: q[i].impacted || [],
          matched_feeds: q[i].matched_feeds || [],
          unknown_feed: q[i].unknown_feed,
        },
      });
    }
  }

  function markCls(ok) { return ok ? "mark-ok" : "mark-bad"; }

  // Highlight the keywords the router actually fired on. `evidence` holds the
  // rule patterns themselves, which are plain enough to reuse as JS regexes.
  function highlight(text, patterns) {
    var out = esc(text);
    (patterns || []).forEach(function (p) {
      try {
        out = out.replace(new RegExp("(" + p + ")", "gi"), "$1");
      } catch (err) { /* a pattern JS cannot compile simply goes unhighlighted */ }
    });
    return out.replace(//g, "<mark>").replace(//g, "</mark>");
  }

  function scoreboard(n) {
    if (!n.type_scores.length) {
      return '<p class="rt-why">No rule matched, so there is no contest to show — <code>admin_other</code> is the fallback, not a decision. That is why confidence is low and the notice escalates.</p>';
    }
    var top = n.type_scores[0][1];
    var html = '<div class="rt-board">';
    n.type_scores.forEach(function (pair, idx) {
      html += '<div class="rt-bar' + (idx === 0 ? " win" : "") + '"><span class="lbl">' + esc(pair[0].replace(/_/g, " ")) + '</span>'
        + '<span class="track"><span class="fill" style="width:' + Math.round((pair[1] / top) * 100) + '%"></span></span>'
        + '<span class="num">' + pair[1] + '</span></div>';
    });
    html += "</div>";
    var second = n.type_scores.length > 1 ? n.type_scores[1][1] : 0;
    html += '<p class="rt-why">Keyword weight, not probability. Margin = (' + top + " − " + second + ") / " + top
      + " = " + n.type_margin.toFixed(2) + ", which is what drives the confidence below.</p>";
    return html;
  }

  function breakdownHTML(n) {
    var g = n.graded, t = n.truth;
    var typeEv = (n.evidence && n.evidence.type) || [];
    var venueEv = (n.evidence && n.evidence.venue) || [];

    var h = '<div class="rt-inner">';

    // 1 — the notice
    h += '<div class="rt-stage"><h4><span>Notice</span><span>' + esc(n.venue) + " · " + esc(n.published) + '</span></h4>'
      + '<div class="rt-text"><b>' + esc(n.title) + "</b><br>" + highlight(n.summary, typeEv.concat(venueEv)) + "</div>"
      + '<p class="rt-why">Highlighted spans are the rule matches. Summaries are our own words about a public notice, not exchange copy — <a href="' + esc(n.source_url) + '" target="_blank" rel="noopener">source</a>.</p></div>';

    // 2 — layer 1
    h += '<div class="rt-stage"><h4><span>Layer 1 · Router</span><span>confidence ' + n.router_confidence.toFixed(2) + '</span></h4>'
      + scoreboard(n)
      + '<div class="rt-fields" style="margin-top:10px">'
      + '<span class="fk">type</span><span class="fv ' + markCls(g.type_ok) + '">' + esc(n.notice_type.replace(/_/g, " "))
      + (g.type_ok ? "" : " — labelled " + esc(t.type.replace(/_/g, " "))) + "</span>"
      + '<span class="fk">venue</span><span class="fv ' + markCls(g.venue_ok) + '">' + esc(n.venue) + "</span>"
      + '<span class="fk">effective</span><span class="fv">' + esc(n.effective_date || "—") + "</span>"
      + '<span class="fk">feeds</span><span class="fv">' + esc((n.matched_feeds || []).join(", ") || "none resolved") + "</span>"
      + "</div></div>";

    // 3 — layer 2
    var c = n.counts;
    h += '<div class="rt-stage"><h4><span>Layer 2 · Impact</span><span>' + c.datasets + " datasets · " + c.systems + " systems · " + c.desks + " desks</span></h4>"
      + '<div class="rt-graph" data-ref="rtgraph"></div>'
      + '<div class="rt-graph-alt"><div class="rt-fields">'
      + '<span class="fk">feeds</span><span class="fv">' + esc((n.matched_feeds || []).join(", ") || "none") + "</span>"
      + '<span class="fk">datasets</span><span class="fv">' + esc((n.datasets || []).join(", ") || "none") + "</span>"
      + '<span class="fk">systems</span><span class="fv">' + esc((n.systems || []).join(", ") || "none") + "</span>"
      + '<span class="fk">desks</span><span class="fv">' + esc((n.desks || []).join(", ") || "none") + "</span>"
      + "</div></div>"
      + '<p class="rt-why">Resolved by traversing the estate from the matched feed — the same <code>resolve_impact</code> the audit uses.</p></div>';

    // 4 — layer 3
    h += '<div class="rt-stage"><h4><span>Layer 3 · Decision</span><span class="split-tag' + (n.split === "held_out" ? " held" : "") + '">' + (n.split === "held_out" ? "held-out" : "dev") + "</span></h4>"
      + '<div class="rt-fields">'
      + '<span class="fk">priority</span><span class="fv ' + markCls(g.priority_ok) + '">' + esc(n.priority)
      + (g.priority_ok ? "" : " — labelled " + esc(t.priority)) + "</span>"
      + '<span class="fk">review</span><span class="fv ' + markCls(g.escalate_ok) + '">' + (n.review_required ? "escalate" : "auto-clear")
      + (g.escalate_ok ? "" : " — should " + (t.escalate ? "escalate" : "auto-clear")) + "</span>"
      + '<span class="fk">owners</span><span class="fv">' + esc(n.assignees.join(", ") || "—") + "</span>"
      + "</div>";

    var wrong = [];
    if (!g.type_ok) wrong.push("type");
    if (!g.venue_ok) wrong.push("venue");
    if (!g.priority_ok) wrong.push("priority");
    if (!g.escalate_ok) wrong.push("escalation");
    if (g.false_clear) {
      h += '<div class="rt-verdict bad" style="margin-top:10px"><b>False clear.</b> This needed a human and did not get one — the failure that actually costs money. '
        + "The escalation rule covers <i>unknown</i> products but not <i>no</i> product, so a notice resolving to nothing cleared as a confident match. "
        + "Found on held-out, so the fix stays unapplied: rules are only tuned on dev.</div>";
    } else if (wrong.length) {
      h += '<div class="rt-verdict bad" style="margin-top:10px">Wrong on ' + wrong.join(", ")
        + (g.unnecessary_review ? " — escalated something that did not need it, which costs attention rather than safety" : "") + ".</div>";
    } else {
      h += '<div class="rt-verdict good" style="margin-top:10px">Matches the label on every graded field.</div>';
    }
    if (t.note) h += '<p class="rt-why">Label note: ' + esc(t.note) + "</p>";
    h += "</div></div>";
    return h;
  }

  // ---- notes ----
  function renderNotes() {
    viewEl.innerHTML = '<div class="notes-body">'
      + '<h2>What this is</h2><p>Vendor and exchange notices — feed migrations, format changes, entitlement and licensing items — each of which might break something downstream. This tool classifies a notice (Layer 1), resolves everything it touches through a typed dependency graph (Layer 2), and turns it into a routed, prioritised, reviewable ticket (Layer 3), then scores its own output.</p>'
      + '<h2>What is real and what is synthetic</h2><p>The <b>26 notices are real</b>: published by Nasdaq (nasdaqtrader.com, full depth) and CME (reconstructed from public metadata — cmegroup.com blocks automated access; those records are marked shallow). Records store the source URL, structured fields and a paraphrase — never the original text, which is the exchange’s copyright. The <b>estate is synthetic</b> (46+ nodes: feeds, datasets, systems, desks, owners, contracts, entitlements) — no firm publishes its real topology. Its lifecycle dates are authored against a reference date of 2025-10-20, so the audit timeline and the notice dates intentionally do not align.</p>'
      + '<h2>Method</h2><p>A stratified dev/held-out split (19/7, seeded) was frozen <b>before any classification rule existed</b>. Rules — deterministic, evidence-logging keyword scoring — were tuned on dev only. Held-out was scored once and reported as-is on the Control Plane tab, including the false clear. Labels are authored by me from the notice content; every record links to its source so they can be checked.</p>'
      + '<h2>What the held-out run taught</h2><p>Three of four failures sit on the conservative side (priority too high, one unnecessary review). The dangerous one: a notice with no venue markers and no recognisable product name cleared as a confident format change. The escalation rule covered <i>unknown products</i> but not <i>no product at all</i>. The fix is one line — escalate on empty feed resolution — and it is deliberately not applied, because it was discovered on held-out data. It ships in the next iteration with a fresh corpus.</p>'
      + '<h2>Limitations</h2><p>n=7 held-out is a smoke signal, not a benchmark. Labels and paraphrases share an author with the rules — the frozen split mitigates tuning leakage but not labelling bias. CME records are thinner than Nasdaq ones. Euronext was planned; its notices sit behind a login portal.</p>'
      + '<p><a href="https://github.com/lucashsu007-create/market-data-toolkit" target="_blank" rel="noopener">Code, corpus, tests and this page’s build script →</a></p>'
      + '</div>';
  }

  // ---- stubs ----
  function renderStub(tab) {
    var t = TABS.filter(function (x) { return x.id === tab; })[0] || { label: tab };
    var next = tab === "control"
      ? "The operator dashboard \u2014 review queue, risk overview, the catalog audit, and the evaluation metrics \u2014 is the next build (Phase D)."
      : "The ecosystem write-up and condensed architecture notes are coming (Phase E).";
    viewEl.innerHTML = '<div class="stub"><h2>' + t.label + "</h2><p>" + next + " For now, explore the Pipeline and the Graph.</p></div>";
  }

  // ---- boot ----
  function fromHash() { var h = (location.hash || "").replace("#", ""); return TABS.some(function (t) { return t.id === h; }) ? h : "overview"; }
  window.addEventListener("hashchange", function () { var h = fromHash(); if (h !== current) { current = h; syncNav(); render(); } });
  current = fromHash();
  syncNav();
  render();
})();
</script>
</body>
</html>
